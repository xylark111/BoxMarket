# BoxMarket - item barter marketplace untuk BoxPvP
# Item yang dijual disimpan di escrow plugin (database), bukan hanya "ditandai" di GUI.
# Item pembayaran dari pembeli disimpan untuk seller dan diambil lewat /bm my (tombol Claim).

storage:
  # sqlite | mysql
  type: sqlite
  mysql:
    host: localhost
    port: 3306
    database: boxmarket
    username: root
    password: ""
    use-ssl: false

# Key PDC untuk item custom yang punya tag identitas. Item ItemEdit/ItemTag biasa TIDAK perlu ini:
# catalog mencocokkan item persis (nama, lore, flag, enchant, tag) dari item aslinya.
# Key PersistentDataContainer untuk mengenali item custom BoxPvP.
# Contoh: item custom punya PDC string "boxpvp:custom_id" = "ember_shard"
custom-item-key: "boxpvp:custom_id"

market:
  # Listing yang lewat X jam hilang dari marketplace; item diambil lewat My Listings.
  # Isi 0 untuk menonaktifkan.
  listing-expire-hours: 72
  # Maksimal jumlah item pembayaran dalam satu listing.
  max-price-amount: 1000000
  # Item yang dilarang dijual.
  blacklisted-materials:
    - BEDROCK
    - BARRIER
    - COMMAND_BLOCK
    - STRUCTURE_BLOCK

# Limit listing AKTIF per rank, mirip sethome-multiple di Essentials.
# Nama rank = nama group LuckPerms (otomatis lewat permission group.<nama>)
# ATAU permission boxmarket.limit.<nama> (mis. boxmarket.limit.vip).
# Player memakai limit TERTINGGI yang dia punya. Isi -1 untuk tanpa batas.
# Selain itu tetap bisa pakai permission angka: boxmarket.sell.limit.<angka> (1 sampai 100),
# dan boxmarket.limit.unlimited untuk tanpa batas.
listing-limits:
  default: 1
  vip: 3
  mvp: 5
# true = nama rank di atas dicocokkan juga dengan group LuckPerms, tanpa perlu menambah permission.
listing-limits-use-groups: true

# Item harga barter sekarang diatur di game: /bm catalog (disimpan di catalog.yml).
# Bagian ini opsional untuk item bawaan; item di sini juga bisa dihapus lewat /bm catalog.
# custom-id kosong = cocok dengan item yang sama persis dengan item polos tanpa tag.
payment-items: {}
#  contoh:
#  crystal:
#    material: EMERALD
#    custom-id: ""
#    name: "&bCrystal"

# Suara GUI. Format: "nama.suara.minecraft, volume, pitch" (pitch 0.5-2.0).
# Kosongkan atau isi "none" untuk mematikan satu suara. enabled: false mematikan semuanya.
# Contoh nama: ui.button.click, entity.player.levelup, block.note_block.pling
# Suara purchase, sell, sold, claim, error, notify, catalog-add dan catalog-remove otomatis
# ikut dimainkan saat pesan terkait dikirim ke player.
sounds:
  enabled: true
  click: "ui.button.click, 0.6, 1.3"
  page: "item.book.page_turn, 0.8, 1.0"
  open: "block.ender_chest.open, 0.4, 1.5"
  select: "entity.experience_orb.pickup, 0.5, 1.6"
  amount-up: "block.note_block.hat, 0.7, 1.6"
  amount-down: "block.note_block.hat, 0.7, 0.9"
  confirm: "block.amethyst_block.chime, 0.9, 1.2"
  purchase: "entity.player.levelup, 0.7, 1.3"
  sell: "entity.villager.yes, 0.8, 1.1"
  sold: "entity.experience_orb.pickup, 0.8, 1.0"
  claim: "entity.item.pickup, 0.8, 1.0"
  error: "entity.villager.no, 0.7, 1.0"
  catalog-add: "block.note_block.pling, 0.8, 1.6"
  catalog-remove: "block.note_block.bass, 0.8, 0.8"
  notify: "block.note_block.chime, 0.8, 1.4"

